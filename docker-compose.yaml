services:
  django:
    build:
      context: .
      target: development

    container_name: gift_finder_django

    working_dir: /opt/pysetup/src

    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

    volumes:
      - ./src:/opt/pysetup/src

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7
    container_name: gift_finder_redis

    ports:
      - "6379:6379"

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    container_name: gift_finder_redisinsight
    restart: always
    depends_on:
      - redis
    ports:
      - "5540:5540"
    volumes:
      - redis-insight:/data

  postgres:
    image: postgres:17
    container_name: gift_finder_postgres

    environment:
      POSTGRES_DB: django_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: django_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U django_user -d django_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis-insight:


