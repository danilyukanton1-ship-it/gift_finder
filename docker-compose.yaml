services:
  redis:
    image: redis:7
    container_name: gift_finder_redis

    ports:
      - "6379:6379"

    restart: unless-stopped

  redis-insight:
    image: redis/redisinsight:latest
    container_name: gift_finder_redisinsight
    restart: always
    depends_on:
      - redis
    ports:
      - "5540:5540"
    volumes:
      - redis-insight:/data

  postgres:
    image: postgres:17
    container_name: gift_finder_postgres

    environment:
      POSTGRES_DB: django_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: django_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data:
  redis-insight:


